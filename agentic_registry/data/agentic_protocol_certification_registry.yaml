validation_rules:
  schema_rules:
    - All ids must be globally unique.
    - Every referenced actor, protocol, version, event, relation, and evidence id must resolve.
    - Every certified protocol must have exactly four certification gates and all must pass.
    - Every relation must carry at least one evidence id, an evidence state, and confidence.
    - A null valid_to means open-ended, not permanent.
    - Dates with less than day precision must declare date_precision.
    - Membership must never be transformed into governance, funding, implementation, or endorsement.
    - ANNOUNCES_SUPPORT_FOR must never be transformed into HOLDS_VOTING_SEAT or DEPLOYS_IN_PRODUCTION.
    - Repository contribution must never imply organisational policy unless affiliation is separately evidenced.
  certification_queries:
    certified_protocols: protocol.certification_verdict in [certified_current, certified_superseded]
    current_protocols: protocol.certification_verdict == certified_current
    formal_governors: relation_type in [GOVERNED_BY, HOLDS_VOTING_SEAT, CHAIRS]
    operational_backers: relation_type in [REFERENCE_IMPLEMENTS, INDEPENDENTLY_IMPLEMENTS, INTEGRATES, DEPLOYS_IN_PRODUCTION]
    narrative_backers: relation_type in [ENDORSES, ANNOUNCES_SUPPORT_FOR]

artifact_generation:
  timeline:
    source_collection: protocol_events
    sort: [event_date, protocol_id, event_type]
    lanes: [tool_context, agent_communication, delegated_authority, commerce, machine_payment]
    required_labels: [protocol_name, event_type, summary]
    uncertainty_style:
      month: reduced_opacity
      year: dashed_outline
      unknown: omit_from_chronological_axis
    show_events:
      - public_launch
      - governance_adoption
      - stewardship_transfer
      - specification_release
      - merger
      - archival
      - production_deployment
  multiplex_graph:
    node_collections: [actors, protocols]
    edge_collection: actor_protocol_relations
    layers:
      origin: [ORIGINATED, CO_DEVELOPED]
      institutional: [DONATED_TO, STEWARDED_BY, MEMBER_OF_STEWARD, FUNDS]
      governance: [GOVERNED_BY, HOLDS_VOTING_SEAT, CHAIRS, MAINTAINS]
      technical: [CONTRIBUTES_CODE, PUBLISHES_SDK, REFERENCE_IMPLEMENTS, INDEPENDENTLY_IMPLEMENTS]
      adoption: [INTEGRATES, DEPLOYS_IN_PRODUCTION]
      narrative: [ENDORSES, ANNOUNCES_SUPPORT_FOR]
    edge_weight_policy: >-
      Do not collapse layers into one support score. If a summary scalar is
      unavoidable, publish the layer vector beside it and expose the weights.
  genealogy:
    source_collection: protocol_protocol_relations
    show_relation_types: [MERGED_INTO, SUPERSEDES, EXTENDS, INTEROPERATES_WITH]

known_gaps:
  - A2A version 0.1.0 release date remains unresolved in this seed.
  - MCP maintainer-person affiliations require a separate time-bounded people layer.
  - UCP's central governance file is distributed across its organisation repositories and needs a dedicated extraction pass.
  - AP2 partner claims need reciprocal partner announcements before being promoted from announced support.
  - x402 member status must be separated from protocol implementation and contribution histories.
  - Production-use claims need independent corroboration and comparable usage measures.
  - Privacy, provenance, licensing, and public-interest impact are outside certification and belong in protocol impact cards.

change_policy:
  monitor_daily:
    - canonical specification pages
    - release feeds
    - governance and maintainer files
  monitor_weekly:
    - TSC membership
    - working-group chairs
    - independent implementation announcements
    - production deployment claims
  snapshot: true
  compute_content_hash: true
  retain_removed_records: true
  close_validity_intervals_on_removal: true
  never_delete_historical_events: true
