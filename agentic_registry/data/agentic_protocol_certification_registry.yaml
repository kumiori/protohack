frontier_candidates:
  - id: candidate_mpp
    name: Machine Payments Protocol
    verdict: held_frontier
    layer: machine_payment
    first_public_date: 2026-03-18
    gate_results:
      public_specification: pass
      version_history: fail
      governance_surface: fail
      implementation: pass
    reason: >-
      Stripe and Tempo published a specification and live implementations, but a
      protocol-level release history and independent public decision process are
      not yet established.
    evidence_ids: [src_mpp_launch, src_mpp_docs]
  - id: candidate_webmcp
    name: WebMCP
    verdict: held_frontier
    layer: tool_context
    gate_results:
      public_specification: pass
      version_history: fail
      governance_surface: pass
      implementation: partial
    reason: W3C incubation supplies governance, but stable protocol versions and broad implementations remain immature.
    evidence_ids: []
  - id: candidate_agntcy
    name: AGNTCY
    verdict: held_frontier
    layer: agent_communication
    gate_results:
      public_specification: partial
      version_history: partial
      governance_surface: pass
      implementation: pass
    reason: >-
      AGNTCY is a governed protocol suite containing discovery, identity,
      messaging, schema, and observability components. Certify OASF, SLIM, and
      Directory separately before adding protocol nodes.
    evidence_ids: [src_agntcy_lf, src_agntcy_docs]
  - id: candidate_anp
    name: Agent Network Protocol
    verdict: held_frontier
    layer: agent_communication
    reason: Insufficient evidence collected for all four gates; retain for a later frontier pass.
    evidence_ids: []
  - id: candidate_erc8004
    name: ERC-8004 Trustless Agents
    verdict: held_frontier
    layer: delegated_authority
    reason: Draft Ethereum standard with implementations, but still a proposal rather than a certified mature protocol in this registry.
    evidence_ids: []

