registry:
  id: mosaic_agentic_protocol_certification_registry
  title: Agentic protocol certification and temporal multiplex registry
  version: 0.2.0
  status: research_seed
  created_at: 2026-08-07
  updated_at: 2026-08-09
  observed_at: 2026-08-07
  timezone: Europe/Paris
  owner: Mosaic relational observatory
  language: en
  public_only: true
  purpose: >-
    Evidence-backed input for generating a dated protocol genealogy and a
    multiplex actor-protocol network. The registry separates technical origin,
    stewardship, governance, maintenance, implementation, deployment,
    endorsement, and announced support.
  scope_rule: >-
    Admit a protocol to the certified core only when public evidence establishes
    a specification, a version history, a governance surface, and at least one
    working implementation. Retain superseded protocols when they passed all
    four gates during their active life and affect the genealogy.
  derived_from:
    - agentic_public_source_registry@0.2.0
  institutional_state_contract:
    source_collection: protocol_regimes
    current_steward_ids: compiler_derived
    steward_graph_edges: compiler_derived
    governor_graph_edges: compiler_derived

certification_policy:
  rule: all_gates_required
  gates:
    public_specification:
      pass_when:
        - A normative or explicitly official specification is publicly readable.
        - The protocol boundary and conformance language can be identified.
      fail_when:
        - Only a launch post, white paper, product page, or SDK README exists.
    version_history:
      pass_when:
        - At least two identifiable protocol or specification versions exist.
        - Releases, tags, dated revisions, or a maintained changelog distinguish them.
      fail_when:
        - Repository commits exist but no protocol-level versions can be resolved.
    governance_surface:
      pass_when:
        - A public charter, governance file, maintainer structure, standards-body
          process, or named decision body defines change authority.
      fail_when:
        - An originating company alone controls changes without a published process.
    implementation:
      pass_when:
        - A runnable SDK, reference implementation, conformance suite, independent
          implementation, or verified production deployment exists.
      fail_when:
        - Only diagrams, examples without runnable code, or announced intent exists.
  verdicts:
    certified_current: All four gates pass and the protocol remains active.
    certified_superseded: All four gates passed, but the protocol was merged, archived, or replaced.
    held_frontier: One or more gates remain unproved or the candidate needs decomposition.
    rejected_out_of_scope: The object is a framework, product, convention, or institution rather than a protocol.
  evidence_states:
    independently_verified: Two compatible sources, including at least one primary source.
    primary_verified: Directly established by one authoritative primary source.
    announced: Claimed in an originator, steward, or partner announcement.
    inferred: Derived from repository or release evidence; never sufficient alone for governance or deployment.
  confidence_scale:
    high: Direct primary evidence with unambiguous actor, relation, and date.
    medium: Primary evidence exists but scope, date, or actor semantics require qualification.
    low: Discovery evidence or inference awaiting primary confirmation.

date_semantics:
  event_date: Date on which the event occurred or became effective.
  published_at: Date on which the cited source was published.
  observed_at: Date on which Mosaic checked the source.
  date_precision_values: [day, month, year, unknown]
  date_basis_values:
    - announcement_publication
    - release_timestamp
    - specification_revision
    - governance_effective_date
    - repository_archival_date
    - first_verified_deployment

controlled_vocabularies:
  protocol_layers:
    tool_context: Agent-to-tool and agent-to-data interaction.
    agent_communication: Agent discovery, messaging, task exchange, and collaboration.
    delegated_authority: User intent, mandates, credentials, and agent authorization.
    commerce: Product discovery, checkout, orders, and post-purchase operations.
    machine_payment: Price negotiation, authorization, payment proof, and settlement over machine interfaces.
  actor_types:
    - company
    - foundation
    - standards_body
    - open_source_project
    - university
    - public_institution
  relation_types:
    ORIGINATED: Actor first designed and publicly introduced the protocol.
    CO_DEVELOPED: Actor is explicitly named as a co-developer.
    DONATED_TO: Originator transferred protocol assets or stewardship to another actor.
    STEWARDED_BY: Actor holds institutional stewardship.
    GOVERNED_BY: Decision body governs the protocol.
    HOLDS_VOTING_SEAT: Organisation holds a formal vote in the governing body.
    CHAIRS: Person or organisation chairs a governing or standards group.
    MAINTAINS: Actor or person has documented maintenance authority.
    CONTRIBUTES_CODE: Repository evidence shows material code or specification contributions.
    PUBLISHES_SDK: Actor publishes a protocol SDK.
    REFERENCE_IMPLEMENTS: Actor publishes an official reference implementation.
    INDEPENDENTLY_IMPLEMENTS: Actor implements without being the originator or official reference publisher.
    INTEGRATES: Actor exposes protocol support inside a product or service.
    DEPLOYS_IN_PRODUCTION: Primary evidence states live production use.
    ENDORSES: Actor explicitly endorses the protocol.
    ANNOUNCES_SUPPORT_FOR: Actor is named as supporting the protocol at a dated event.
    MEMBER_OF_STEWARD: Actor belongs to the protocol's steward foundation; this does not imply a vote or implementation.
    FUNDS: Actor provides direct project funding; foundation membership alone is insufficient.
    EXTENDS: Protocol or actor publishes a compatible extension.
    INTEROPERATES_WITH: Specifications define a binding or compatibility path.
    SUPERSEDES: Protocol replaces another protocol.
    MERGED_INTO: Protocol development is absorbed into another project.
  event_types:
    - repository_created
    - public_launch
    - specification_release
    - governance_adoption
    - stewardship_transfer
    - foundation_launch
    - implementation_release
    - production_deployment
    - extension_release
    - merger
    - archival
  regime_types:
    - stewardship
    - governance
    - repository_control
    - technical_maintenance
  participant_roles:
    - institutional_home
    - governing_project
    - governing_body
    - repository_controller
    - technical_maintainer
    - originator_custodian
    - project_custodian
    - unknown
  regime_statuses:
    - verified
    - announced
    - unknown
    - disputed
  transition_kinds:
    - stewardship_transfer
    - governance_adoption
    - protocol_merger
    - regime_termination
  transition_mechanisms:
    - donation
    - contribution
    - charter_adoption
    - committee_formation
    - merger
    - archival
    - other_declared
  asset_effects:
    - transferred
    - retained_by_originator
    - unchanged
    - unresolved

