protocols:
  - id: protocol_mcp
    name: Model Context Protocol
    acronym: MCP
    object_type: protocol
    layer: tool_context
    status: active
    certification_verdict: certified_current
    first_public_date: 2024-11-25
    originator_ids: [org_anthropic]
    canonical_specification: https://modelcontextprotocol.io/specification/2026-07-28
    canonical_repository: https://github.com/modelcontextprotocol/modelcontextprotocol
    license: Apache-2.0
    certification:
      public_specification:
        result: pass
        evidence_ids: [src_mcp_spec_current]
      version_history:
        result: pass
        evidence_ids: [src_mcp_changelog_2025_11, src_mcp_changelog_2026_07]
      governance_surface:
        result: pass
        evidence_ids: [src_mcp_governance, src_mcp_governance_launch]
      implementation:
        result: pass
        evidence_ids: [src_mcp_ts_sdk, src_openai_mcp, src_microsoft_mcp_ga]
    version_ids: [mcp_2024_11_05, mcp_2025_03_26, mcp_2025_06_18, mcp_2025_11_25, mcp_2026_07_28]
    event_ids: [evt_mcp_launch, evt_mcp_governance, evt_mcp_aaif_transfer, evt_mcp_2026_release]
    analytical_note: >-
      MCP has the broadest implementation surface in the certified set. Technical
      governance is individual and maintainer-based, while institutional hosting
      sits in AAIF. Do not infer protocol control from AAIF membership.

  - id: protocol_a2a
    name: Agent2Agent Protocol
    acronym: A2A
    object_type: protocol
    layer: agent_communication
    status: active
    certification_verdict: certified_current
    first_public_date: 2025-04-09
    originator_ids: [org_google]
    canonical_specification: https://a2a-protocol.org/latest/specification/
    canonical_repository: https://github.com/a2aproject/A2A
    license: Apache-2.0
    certification:
      public_specification: {result: pass, evidence_ids: [src_a2a_spec]}
      version_history: {result: pass, evidence_ids: [src_a2a_releases]}
      governance_surface: {result: pass, evidence_ids: [src_a2a_governance]}
      implementation: {result: pass, evidence_ids: [src_a2a_sdks, src_agentgateway_a2a]}
    version_ids: [a2a_0_1_0, a2a_0_2_6, a2a_0_3_0, a2a_1_0_0, a2a_1_0_1]
    event_ids: [evt_a2a_launch, evt_a2a_lf_transfer, evt_a2a_0_3, evt_a2a_acp_merge, evt_a2a_1_0]
    analytical_note: >-
      A2A separates launch supporters from formal governors. Eight companies hold
      startup-phase TSC seats. The launch partner list is a weaker relation and
      must not be projected as governance.

  - id: protocol_acp
    name: Agent Communication Protocol
    acronym: ACP
    object_type: protocol
    layer: agent_communication
    status: superseded
    certification_verdict: certified_superseded
    first_public_date: 2025
    date_precision: year
    originator_ids: [org_ibm, org_beeai]
    canonical_specification: https://agentcommunicationprotocol.dev/
    canonical_repository: https://github.com/i-am-bee/acp
    license: Apache-2.0
    superseded_by: protocol_a2a
    certification:
      public_specification: {result: pass, evidence_ids: [src_acp_docs]}
      version_history: {result: pass, evidence_ids: [src_acp_releases]}
      governance_surface: {result: pass, evidence_ids: [src_acp_repo]}
      implementation: {result: pass, evidence_ids: [src_acp_repo]}
    version_ids: [acp_1_0_0, acp_1_0_1, acp_1_0_2, acp_1_0_3]
    event_ids: [evt_acp_1_0, evt_a2a_acp_merge, evt_acp_archive]
    analytical_note: >-
      ACP is retained as a historical node because it reached 1.0, shipped Python
      and TypeScript implementations, and then merged into A2A. Removing it would
      erase an observed consolidation event.

  - id: protocol_ap2
    name: Agent Payments Protocol
    acronym: AP2
    object_type: protocol
    layer: delegated_authority
    status: active_standardization
    certification_verdict: certified_current
    first_public_date: 2025-09-16
    originator_ids: [org_google]
    canonical_specification: https://ap2-protocol.org/specification/
    canonical_repository: https://github.com/google-agentic-commerce/AP2
    license: Apache-2.0
    certification:
      public_specification: {result: pass, evidence_ids: [src_ap2_docs, src_ap2_repo]}
      version_history: {result: pass, evidence_ids: [src_ap2_repo, src_ap2_fido_transfer]}
      governance_surface: {result: pass, evidence_ids: [src_fido_agentic_work, src_fido_groups]}
      implementation: {result: pass, evidence_ids: [src_ap2_repo, src_ap2_launch]}
    version_ids: [ap2_0_1, ap2_0_2]
    event_ids: [evt_ap2_launch, evt_ap2_x402_extension, evt_ap2_0_2_fido]
    analytical_note: >-
      AP2 specifies mandates and verifiable authority around payment. FIDO now
      reviews and develops the contribution through member working groups. The
      Google repository remains the implementation locus, so stewardship and
      repository control should be monitored separately.

  - id: protocol_ucp
    name: Universal Commerce Protocol
    acronym: UCP
    object_type: protocol
    layer: commerce
    status: active
    certification_verdict: certified_current
    first_public_date: 2026-01-11
    originator_ids: [org_google]
    canonical_specification: https://ucp.dev/latest/specification/overview/
    canonical_repository: https://github.com/Universal-Commerce-Protocol/ucp
    license: Apache-2.0
    certification:
      public_specification: {result: pass, evidence_ids: [src_ucp_spec]}
      version_history: {result: pass, evidence_ids: [src_ucp_releases]}
      governance_surface: {result: pass, evidence_ids: [src_ucp_repo, src_ucp_maintainers]}
      implementation: {result: pass, evidence_ids: [src_ucp_launch, src_google_ucp_deployment]}
    version_ids: [ucp_2026_01_11, ucp_2026_01_23, ucp_2026_04_08]
    event_ids: [evt_ucp_launch, evt_ucp_2026_01_23, evt_ucp_production, evt_ucp_2026_04_08]
    analytical_note: >-
      UCP governs the commerce journey rather than payment settlement alone. Its
      co-development network is documented, and Google provides production
      deployment evidence. The project's organisational governance remains less
      institutionally independent than A2A or x402 and should be watched.

  - id: protocol_x402
    name: x402
    acronym: x402
    object_type: protocol
    layer: machine_payment
    status: active
    certification_verdict: certified_current
    first_public_date: 2025-05
    date_precision: month
    originator_ids: [org_coinbase]
    canonical_specification: https://github.com/x402-foundation/x402/tree/main/specs
    canonical_repository: https://github.com/x402-foundation/x402
    license: Apache-2.0
    certification:
      public_specification: {result: pass, evidence_ids: [src_x402_repo]}
      version_history: {result: pass, evidence_ids: [src_x402_v2, src_x402_repo]}
      governance_surface: {result: pass, evidence_ids: [src_x402_lf_intent, src_x402_lf_operational]}
      implementation: {result: pass, evidence_ids: [src_x402_repo, src_cloudflare_x402]}
    version_ids: [x402_v1, x402_v2]
    event_ids: [evt_x402_launch, evt_x402_foundation_intent, evt_x402_v2, evt_x402_lf_transfer, evt_x402_operational]
    analytical_note: >-
      x402 is the direct bridge between agent interfaces and programmable
      settlement. Foundation membership indicates institutional participation,
      not implementation. Production claims and protocol governance remain
      separate graph layers.

