            'Itération de test du 20 septembre 2026. Corrections éditoriales et d’interface issues du dry run : consentement
            explicite, disponibilité simplifiée, voix je/nous, groupes repliables, localisation assistée, calibration de l’inspiration,
            clarification des champs complémentaires, prévisualisation du payload avant écriture.'
