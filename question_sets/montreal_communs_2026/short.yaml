step_copy:
    welcome:
        title: Communs de données et IA
        body:
            'Pour finaliser notre inscription au Forum Communs de données et IA (28–29 octobre 2026, INRS), prenons environ
            20 minutes pour répondre à ces questions.


            Cette démarche poursuit deux objectifs :

            1. Mieux nous connaître : situer nos champs d’activité, ce que nous pouvons partager, ce que nous recherchons et nos
            visions du futur.

            2. Documenter un projet, si applicable : lorsqu’une organisation culturelle, patrimoniale ou éducative porte un projet
            lié à la thématique du Forum, nous pouvons l’intégrer à la base de connaissances qui accompagne l’événement, notamment
            sous l’angle des données, ressources, pratiques, gouvernance, licences, infrastructures et modèles économiques.


            Plus largement, nos réponses permettront de cartographier le réseau d’acteurs en présence, les collaborations établies
            et les initiatives collectives existantes.


            Une version courte est proposée à l’ensemble des personnes participantes; une version longue pourra approfondir les
            projets documentés.


            Sauf indication contraire, plusieurs choix sont possibles. Nous pouvons passer ou signaler chaque question. Nous pourrons
            relire, modifier, réaligner et faire évoluer nos réponses.'
        cta: Commencer
    participation_information:
        title: Informations sur ma participation
        body: '

            Les informations recueillies serviront à préparer l’organisation du Forum Communs de données et IA des 28-29 octobre 2026. Elles pourront également nourrir des publications qui découleront de cet évènement (synthèse, article scientifique).


            Votre nom ne sera pas mentionné dans les publications qui découleront du projet.


            Vos réponses seront conservées de façon sécurisée durant 5 ans et ne seront accessibles qu’à l équipe de recherche.


            Certaines informations d’identification professionnelle seront partagées avec les autres participants de l’événement pour faciliter le réseautage. /* */conse


            Vous êtes libres de répondre ou non à une question posée, et vous pourrez quitter à tout moment le sondage. Dans ce cas, vos données ne seront pas utilisées.


            Si vous souhaitez retirer vos réponses, vous pouvez contacter les personnes responsables (ci-dessous).


            ------

            Les informations recueillies servent à préparer et documenter le Forum Communs de données et IA des 28–29 octobre 2026. Elles pourront également contribuer aux productions issues de cette expérimentation, notamment une synthèse du Forum ou des publications scientifiques.


            Mes réponses et mon identité sont traitées séparément. Mon nom n’est pas associé publiquement à mes réponses et n’est pas mentionné dans les publications issues du projet, sauf si je choisis explicitement de l’autoriser.


            Après intégration, mes réponses sont conservées dans une base de données du projet sécurisée hébergée à distance (notion.so). Les données permettant de m’identifier sont conservées séparément des réponses au questionnaire. Les réponses peuvent ainsi être analysées sans qu’il soit nécessaire d’y associer directement mon identité.


            Certaines informations professionnelles peuvent être utiles pour permettre aux personnes participant au Forum de se retrouver, d’échanger et de poursuivre des collaborations. Ce partage fera l’objet d’un choix explicite de ma part. De même, l’utilisation de mes coordonnées pour la coordination ou le suivi du Forum nécessite mon accord.


            Je reste libre de répondre ou non à chaque question. Je peux interrompre le questionnaire à tout moment. Des points de sauvegarde me permettent de conserver l’état de mon parcours dans ma session et d’en télécharger une copie personnelle au format YAML afin de pouvoir le reprendre ultérieurement.


            Tant que je n’ai pas choisi l’action finale « Intégrer mes réponses », mon brouillon n’est pas transmis à la base de données du Forum. Avant cette intégration, je peux examiner les données qui seront transmises.


            Lors de l’intégration, une clé d’accès personnelle me sera remise. Elle me permettra de retrouver et, selon les fonctionnalités proposées, de modifier mes réponses sans besoin d’intervention de quelqu’un•e à ma place. Je conserverai cette clé soigneusement.

            Pour toute question concernant la méthodologie, la conception du questionnaire, le traitement des données ou cette expérimentation, je peux contacter les personnes responsables indiquées ci-dessous.


            **Responsables**

            - Nathalie Casemajor, professeure à l’INRS — nathalie.casemajor@inrs.ca

            - Marta Severo, professeure à l’Université Paris Nanterre — msevero@parisnanterre.fr

            - Andrés A. León Baldelli, chargé de recherche CNRS — leon.baldelli@cnrs.fr

            '
        cta: Continuer
    participation:
        title: Ma participation
        body:
            'L’atelier réunit un nombre restreint de 40 personnes sélectionnées sur invitation pour un engagement actif et collectif.
            Je privilégie une présence aux deux journées : une disponibilité partielle peut potentiellement priver une autre personne
            d’y participer. En cas de disponibilité limitée, l’équipe pourra reprendre contact avec moi pour préciser les modalités.'
        cta: Continuer
    portrait:
        title: Qui suis-je ?
        body:
            'Je situe mon activité et, le cas échéant, mon organisation dans l’écosystème des acteurs présents au Forum. Aucune
            réponse substantielle n’est obligatoire : chaque question peut être passée.'
        cta: Continuer
    organisation:
        title: Mon organisation
        body: Ces questions apparaissent lorsque je participe au nom d’une organisation.
        cta: Continuer
    project:
        title: Un projet à documenter ?
        body:
            Si mon organisation développe un projet de mise à disposition de données dans le contexte des usages de l’IA, je
            peux choisir de le documenter.
        cta: Continuer
    exchange_offer:
        title: Ce que nous mettons en commun
        body:
            'Nous cartographions ce que nous pouvons partager sur les communs de données et l’IA : connaissances, expérimentations,
            outils ou ressources.'
        cta: Continuer
    exchange_need:
        title: Ce que je recherche
        body:
            'La même carte est utilisée dans les deux directions : ce que je peux apporter et ce que j’aimerais recevoir des
            autres.'
        cta: Continuer
    friction:
        title: Ce qui freine ma capacité à avancer
        body: Je distingue les contraintes actuelles des ressources ou connaissances que je recherche.
        cta: Continuer
    inspiration:
        title: Ce qui m’inspire
        body: Une initiative, un outil, une communauté ou une expérience peut ouvrir une piste inattendue.
        cta: Continuer
    future_intro:
        title: Vision du futur
        body:
            'Nous cherchons ici des pistes d’action par rétroplanification à partir d’un futur souhaité pour les communs de
            données, qui sera approfondi lors du Forum.


            En 2027, Genève accueillera un prochain sommet international sur l’IA, dans la continuité des sommets de Bletchley Park
            (2023), Séoul (2024), Paris (2025) et New Delhi (2026). Prenons Genève comme horizon de travail et projetons-nous au
            lendemain de ce rendez-vous, dans un scénario favorable aux communs de données.


            Les résultats possibles ne sont pas limités à des productions institutionnelles : ils peuvent aussi prendre la forme
            d’une expérimentation, d’une nouvelle collaboration, d’un désaccord devenu plus clair, d’un apprentissage issu d’un
            échec ou d’une initiative inattendue.'
        cta: Nous projeter
    future_outcome:
        title: Ce que nous aimerions voir émerger
        body: À quoi pourrait ressembler, pour nous, un résultat positif pour les communs de données ?
        cta: Continuer
    future_effects:
        title: Ce que cela changerait
        body: Passons du résultat souhaité à ses effets concrets dans nos pratiques, projets, organisations ou domaines de recherche.
        cta: Continuer
    future_conditions:
        title: Comment y arriver ?
        body: Décomposons le chemin en étapes ou actions, et associons à chacune les acteur·ices susceptibles de la porter.
        cta: Continuer
    future_contribution:
        title: Ce que je peux mettre sur la table
        body: Nous cherchons ici ce que chacun·e pourrait concrètement apporter pour rendre ce futur plus accessible.
        cta: Continuer
    scenario_position:
        title: Depuis quelle position puis-je agir ?
        body:
            Nous partons d’abord des positions réelles depuis lesquelles chacun·e peut agir. Nous pouvons ensuite ouvrir, si
            nous le souhaitons, une position à explorer pendant l’exercice.
        cta: Continuer
    review:
        title: Relire mes réponses
        body:
            Je relis, modifie et réaligne mes réponses. Les questions passées, les raisons de passage et les signalements doivent
            rester visibles et éditables.
        cta: Intégrer au paysage commun
    done:
        title: Merci
        body:
            'Merci d’avoir pris le temps de contribuer. Mes réponses ont été enregistrées et peuvent maintenant participer à
            une représentation collective du Forum. Des informations pratiques concernant le déroulement de l’événement suivront.
            Pour une précision ou une demande de retrait : nathalie.casemajor@inrs.ca et msevero@parisnanterre.fr.'
        cta: Voir le paysage commun
