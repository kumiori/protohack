      free_text:
          field: future_effects_other
          prompt: Autre effet concret
      companion:
          field: future_effects_detail
          prompt: Un exemple concret, si je le souhaite
          required: false
    - step: future_conditions
      field: future_conditions
      id: future_conditions
      revision: 3
      prompt:
          Quelles étapes permettraient à ce résultat de se concrétiser, et quels acteur·ices pourraient porter chacune d’elles
          ?
      input_type: repeatable_group
      required: false
      min_items: 0
      fields:
          - field: category
            prompt: Catégorie d’action
            input_type: text_with_suggestions
            required: false
            suggestions:
                - Concertation / consultation
                - Formation ou élargissement d’une coalition
                - Prise de contact / mise en relation
                - Cartographie / documentation
                - Expérimentation / pilote
                - Prototype / infrastructure
                - Partage ou ouverture de données
                - Définition d’un standard ou protocole
                - Accord / convention / contrat
                - Évolution réglementaire
                - Décision institutionnelle
                - Mobilisation / plaidoyer
                - Financement
                - Évaluation / preuve
                - Communication publique
                - Autre
            suggestion_label: Je peux partir d’une suggestion
          - field: details
            prompt: Étape ou action nécessaire
            input_type: text
            required: false
            detail_prompt: J’ajoute 1 à 3 détails pour préciser cette étape
            detail_placeholder: Qui ? quoi ? dans quelles conditions ?
            voice_note:
                enabled: false
                label: Message vocal
                presentation: round_button
                disabled_note: Bientôt disponible
          - field: actors
            prompt: Acteur·ices susceptibles de porter cette étape
            input_type: grouped_multi
            required: false
            taxonomy: actor_types
            free_text:
                field: actors_other
                prompt: Autre acteur·ice
    - step: future_contribution
