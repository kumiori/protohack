questions:
    - step: participation_information
      field: participation_acknowledgement
      id: participation_acknowledgement
      revision: 3
      prompt:
          Je reconnais avoir lu les informations ci-dessus. Les modalités me paraissent raisonnables et j’accepte de participer
          à cette recherche et de répondre au présent questionnaire, selon les modalités décrites, afin que mes données soient utilisées
          pour les objectifs énoncés.
      input_type: single
      required: true
      options:
          - value: accept
            label: J’accepte
          - value: decline
            label: Je n’accepte pas
          - value: read_not_understood
            label: J’ai lu mais je n’ai pas compris
          - value: not_read
            label: Je n’ai pas lu
      routing:
          end_session:
              when:
                  equals: decline
          show_contact:
              when:
                  equals: read_not_understood
          return_to_information:
              when:
                  equals: not_read
              toast: Merci de lire les informations de participation avant de poursuivre.
              scroll_to: participation_information
      allow_skip: true
      skip_action: end
    - step: participation
      field: availability
      id: availability
      revision: 3
      prompt: Quand puis-je être présent·e ?
      context: Je sélectionne toutes les plages pendant lesquelles je suis disponible.
      input_type: multi
      required: false
      shortcuts:
          - id: both_full_days
            label: Les deux journées complètes · 28 et 29 octobre
            select:
                - oct28_am_online
                - oct28_pm_inrs
                - oct29_am_inrs
                - oct29_pm_inrs
      options:
          - value: oct28_am_online
            label: 28 octobre · matin · en ligne
          - value: oct28_pm_inrs
            label: 28 octobre · après-midi · présentiel, INRS Montréal
          - value: oct29_am_inrs
            label: 29 octobre · matin · présentiel, INRS Montréal
          - value: oct29_pm_inrs
            label: 29 octobre · après-midi · présentiel, INRS Montréal
    - step: participation
      field: dietary_preferences
      id: dietary_preferences
      revision: 2
      prompt: Quelles sont mes préférences ou contraintes alimentaires ?
      context: Plusieurs choix possibles.
      input_type: multi_with_other
      required: false
      options:
          - value: omnivore
            label: Omnivore
          - value: vegetarian
            label: Végétarien
          - value: vegan
            label: Végétalien
          - value: no_pork
            label: Sans porc
          - value: gluten_free
            label: Sans gluten
          - value: lactose_free
            label: Sans lactose
          - value: food_allergy
            label: Allergie alimentaire
          - value: other
            label: Autre
      free_text:
          field: dietary_preferences_detail
          prompt: Je précise si nécessaire
          show_if:
              any:
                  - field: dietary_preferences
                    contains: food_allergy
                  - field: dietary_preferences
                    contains: other
    - step: portrait
      field: name
      id: name
      revision: 2
      prompt: Mon prénom et mon nom
      input_type: text
      required: false
    - step: portrait
      field: participation_position
      id: participation_position
      revision: 2
      prompt: Dans quelle(s) position(s) est-ce que je participe ?
      input_type: multi_with_other
      required: false
      options:
          - value: individual
            label: À titre individuel
          - value: organisation
            label: Au nom d’une organisation
          - value: other
            label: Autre
      free_text:
          field: participation_position_other
          prompt: Je précise
    - step: portrait
      field: base_location
      id: base_location
      revision: 3
      prompt: Où est-ce que je suis principalement basé·e pour mon activité ?
      input_type: location
      required: false
      capabilities:
          manual_text: true
          geolocation_lookup: true
          geolocation_requires_user_action: false
          lookup_trigger: after_text_input
          lookup_behavior: suggest_and_confirm_match
    - step: portrait
      field: sectors
      id: sectors
      revision: 2
      prompt: Dans quels secteurs se situe mon activité ?
      input_type: grouped_multi
      required: false
      taxonomy: sectors
      free_text:
          field: sectors_other
          prompt: Autre secteur
    - step: portrait
      field: functions
      id: functions
      revision: 2
      prompt: Quelles fonctions est-ce que j’exerce ?
      context: Plusieurs choix possibles.
      input_type: grouped_multi
      required: false
      taxonomy: functions
      free_text:
          field: functions_other
          prompt: Autre fonction
    - step: organisation
      field: organisation_name
      id: organisation_name
      revision: 2
      prompt: Mon organisation
      input_type: text
      required: false
      show_if:
          field: participation_position
          contains: organisation
    - step: organisation
      field: organisation_size
      id: organisation_size
      revision: 2
      prompt: Quelle est la taille de mon organisation ?
      input_type: single
      required: false
      options:
          - value: lt20
            label: Moins de 20 personnes
          - value: '20_99'
            label: 20 à 99 personnes
          - value: 100_plus
            label: 100 personnes et plus
      show_if:
          field: participation_position
          contains: organisation
    - step: organisation
      field: organisation_territory
      id: organisation_territory
      revision: 2
      prompt: Sur quels territoires mon organisation opère-t-elle ?
      input_type: multi_with_other
      required: false
      options:
          - value: quebec
            label: Québec
          - value: other_canadian_province
            label: Autre province canadienne
          - value: canada
            label: Canada
          - value: france
            label: France
          - value: other_eu
            label: Autre pays de l’Union européenne
          - value: other
            label: Autre
      free_text:
          field: organisation_territory_other
          prompt: Je précise le territoire
      show_if:
          field: participation_position
          contains: organisation
    - step: project
      field: document_project
      id: document_project
      revision: 2
      prompt: Est-ce que je souhaite documenter un projet de mon organisation ?
      context: Un projet de mise à disposition de données dans le contexte des usages de l’IA.
      input_type: single
      required: false
      options:
          - value: 'yes'
            label: Oui
          - value: 'no'
            label: Non
          - value: not_applicable
            label: Ne s’applique pas
      show_if:
          field: participation_position
          contains: organisation
    - step: project
      field: project_name
      id: project_name
      revision: 2
      prompt: Quel est le nom du projet que je souhaite documenter ?
      input_type: text
      required: false
      show_if:
          field: document_project
          equals: 'yes'
    - step: project
      field: project_description
      id: project_description
      revision: 2
      prompt: Je décris le projet en une phrase, en précisant son objectif.
      input_type: text
      required: false
      show_if:
          field: document_project
          equals: 'yes'
    - step: project
      field: project_url
      id: project_url
      revision: 2
      prompt: Un lien permet-il d’en savoir plus ?
      input_type: url
      required: false
      show_if:
          field: document_project
          equals: 'yes'
    - step: exchange_offer
      field: knowledge_offer
      id: knowledge_offer
      revision: 3
      prompt: Dans quels domaines est-ce que je peux partager une expertise, une expérimentation, un outil ou une ressource ?
      input_type: grouped_multi
      required: false
      taxonomy: commons_ai_topics
      free_text:
          field: knowledge_offer_other
          prompt: Autre domaine
      companion:
          field: knowledge_offer_example
          prompt: Si je le souhaite, je donne un exemple concret de ce que je pourrais partager
          required: false
    - step: exchange_need
      field: knowledge_need
      id: knowledge_need
      revision: 3
      prompt: Dans quels domaines est-ce que je souhaite approfondir mes connaissances ou trouver un appui ?
      input_type: grouped_multi
      required: false
      taxonomy: commons_ai_topics
      free_text:
          field: knowledge_need_other
          prompt: Autre domaine
      companion:
          field: knowledge_need_example
          prompt: Si je le souhaite, je donne un exemple concret de ce que j’aimerais trouver ou approfondir
          required: false
    - step: friction
      field: frictions
      id: frictions
      revision: 1
      prompt: Qu’est-ce qui freine aujourd’hui ma capacité à avancer ?
      input_type: multi_with_other
      required: false
      max_select: 4
      taxonomy: friction_types
      free_text:
          field: frictions_other
          prompt: Autre frein
    - step: inspiration
      field: inspiration
      id: inspiration
      revision: 3
      prompt: Qu’est-ce qui nourrit aujourd’hui ma manière de penser ou d’agir autour des communs de données et de l’IA ?
      input_type: multi_with_other
      required: false
      max_select: 3
      options:
          - value: person_collective
            label: Une personne ou un collectif
          - value: practice_method
            label: Une pratique ou une méthode
          - value: tool_infrastructure
            label: Un outil ou une infrastructure
          - value: project_experiment
            label: Un projet ou une expérimentation
          - value: protocol_standard
            label: Un protocole ou un standard
          - value: text_work
            label: Un texte, une œuvre ou un manifeste
          - value: place_event
            label: Un lieu ou un événement
          - value: historical_precedent
            label: Un précédent historique
          - value: controversy_failure
            label: Un conflit, une controverse ou un échec
          - value: movement_policy
            label: Un mouvement ou une politique publique
          - value: unexpected_source
            label: Quelque chose d’inattendu ou hors champ
          - value: other
            label: Autre
      companion:
          field: inspiration_detail
          prompt: Je nomme ou décris brièvement ce qui m’inspire, si je le souhaite
          required: false
      context: Je choisis jusqu’à trois sources d’inspiration que j’aurais envie d’apporter dans la conversation.
      selection_feedback:
          at_limit: 3 choix sélectionnés
          over_limit: spectacular_soft_block
          message: 'Trois inspirations maximum : retirons-en une pour continuer.'
    - step: future_outcome
      field: future_outcome
      id: future_outcome
      revision: 3
      prompt: À quoi pourrait ressembler, pour nous, un résultat positif ?
      input_type: multi_with_other
      required: false
      max_select: 5
      options:
          - value: political_commitment
            label: Un engagement politique
          - value: new_policy
            label: Une nouvelle règle ou politique publique
          - value: coalition
            label: Une coalition
          - value: protocol_standard
            label: Un protocole ou standard
          - value: infrastructure_tool
            label: Une infrastructure ou un outil
          - value: funding
            label: Un financement
          - value: shared_resource
            label: Une ressource mise en commun
          - value: collaboration
            label: Une nouvelle collaboration
          - value: experiment
            label: Une expérimentation concrète
          - value: practice_change
            label: Un changement de pratique dans une organisation
          - value: clearer_disagreement
            label: Un désaccord devenu plus clair
          - value: new_question
            label: Une question nouvelle devenue visible
          - value: learning_from_failure
            label: Un échec dont nous pouvons apprendre
          - value: public_mobilisation
            label: Une mobilisation publique
          - value: unexpected_initiative
            label: Une initiative inattendue
          - value: other
            label: Autre
      free_text:
          field: future_outcome_other
          prompt: Autre résultat possible
      companion:
          field: future_outcome_detail
          prompt: Je précise si je le souhaite
          required: false
    - step: future_effects
      field: future_effects
      id: future_effects
      revision: 3
      prompt: Qu’est-ce que cela changerait concrètement ?
      input_type: multi_with_other
      required: false
      max_select: 5
      options:
          - value: enable_action
            label: Rendre possible une action aujourd’hui difficile ou impossible
          - value: change_practice
            label: Modifier une pratique
          - value: change_rule
            label: Faire évoluer une règle
          - value: resource_access
            label: Donner accès à une ressource
          - value: support_project
            label: Renforcer un projet existant
          - value: collaboration
            label: Faire émerger une collaboration
          - value: capacity
            label: Développer une capacité
          - value: reduce_dependency
            label: Réduire une dépendance
          - value: new_experiment
            label: Ouvrir une nouvelle expérimentation
          - value: other
            label: Autre
      free_text:
          field: future_effects_other
          prompt: Autre effet concret
      companion:
          field: future_effects_detail
          prompt: Un exemple concret, si je le souhaite
          required: false
    - step: future_conditions
      field: future_conditions
      id: future_conditions
      revision: 3
      prompt:
          Quelles étapes permettraient à ce résultat de se concrétiser, et quels acteur·ices pourraient porter chacune d’elles
          ?
      input_type: repeatable_group
      required: false
      min_items: 0
      fields:
          - field: action
            prompt: Étape ou action nécessaire
            input_type: text_with_suggestions
            required: false
            suggestions:
                - Concertation / consultation
                - Formation ou élargissement d’une coalition
                - Prise de contact / mise en relation
                - Cartographie / documentation
                - Expérimentation / pilote
                - Prototype / infrastructure
                - Partage ou ouverture de données
                - Définition d’un standard ou protocole
                - Accord / convention / contrat
                - Évolution réglementaire
                - Décision institutionnelle
                - Mobilisation / plaidoyer
                - Financement
                - Évaluation / preuve
                - Communication publique
                - Autre
            suggestion_label: Je peux partir d’une suggestion
            detail_prompt: J’ajoute 1 à 3 détails pour préciser cette étape
            detail_placeholder: Qui ? quoi ? dans quelles conditions ?
            voice_note:
                enabled: false
                label: Message vocal
                presentation: round_button
                disabled_note: Bientôt disponible
          - field: actors
            prompt: Acteur·ices susceptibles de porter cette étape
            input_type: grouped_multi
            required: false
            taxonomy: actor_types
            free_text:
                field: actors_other
                prompt: Autre acteur·ice
    - step: future_contribution
      field: future_contribution
      id: future_contribution
      revision: 3
      prompt: Qu’est-ce que je pourrais concrètement apporter ?
      input_type: multi_with_other
      required: false
      max_select: 6
      options:
          - value: share_expertise
            label: Partager une expertise
          - value: share_data
            label: Partager des données ou ressources
          - value: provide_tool
            label: Mettre à disposition un outil
          - value: build_test
            label: Construire ou tester un prototype
          - value: document
            label: Documenter une expérience
          - value: connect_people
            label: Mettre des personnes en relation
          - value: join_coalition
            label: Rejoindre une coalition
          - value: initiate_coalition
            label: Initier une coalition
          - value: adapt_practice
            label: Adapter une pratique dans mon organisation
          - value: internal_discussion
            label: Porter une discussion dans mon organisation
          - value: advocacy
            label: Plaider pour une évolution de politique
          - value: protocol_standard
            label: Contribuer à un standard ou protocole
          - value: organise_experiment
            label: Organiser une rencontre ou expérimentation
          - value: fund_support
            label: Financer / soutenir une action
          - value: other
            label: Autre
      free_text:
          field: future_contribution_other
          prompt: Autre contribution
    - step: scenario_position
      field: scenario_position
      id: scenario_position
      revision: 3
      prompt: Depuis quelle(s) position(s) réelle(s) pourrais-je agir dans cet exercice ?
      input_type: grouped_multi
      required: false
      taxonomy: actor_types
      free_text:
          field: scenario_position_other
          prompt: Autre position réelle
      companion:
          field: scenario_position_explore
          prompt: Quelle position, même éloignée de la mienne, aimerais-je explorer ou mieux comprendre pendant l’exercice ?
          required: false
interaction:
    nothing_substantively_mandatory: true
    question_resolution:
        - answer
        - skip
        - flag
    answer_before_meta_actions: true
    subordinate_fields_inherit_parent_resolution: true
    skip:
        enabled: true
        reason_prompt: Pourquoi est-ce que je passe cette question ?
        reasons:
            - value: not_applicable
              label: Non applicable
            - value: dont_know
              label: Je ne sais pas
            - value: prefer_not
              label: Je préfère ne pas répondre
            - value: cannot_answer
              label: La question ne me permet pas de répondre correctement
            - value: other
              label: Autre
        note_optional: true
    flag:
        enabled: true
        prompt: Signalons positivement ou négativement ce qui fonctionne, ce qui ne fonctionne pas ou mérite attention.
        options:
            - value: interesting
              label: Intéressante
            - value: useful
              label: Utile
            - value: thought_provoking
              label: Stimulante
            - value: well_framed
              label: Bien formulée
            - value: incomplete
              label: Incomplète
            - value: misleading
              label: Trompeuse
            - value: too_narrow
              label: Trop étroite
            - value: unclear
              label: Peu claire
            - value: missing_option
              label: Option manquante
        note_optional: true
    review_editable: true
    mobile:
        prefer_selection_over_typing: true
    validation:
        optional_companions_do_not_block: true
        free_text_for_other_required_only_when_other_selected: true
        max_select_feedback: inline_immediate
        invalid_reason_must_be_specific: true
    submission_preview:
        enabled: true
        position: before_persist
        title: Prévisualiser ce qui sera envoyé
        show_exact_payload: true
        format: json
        allow_copy: true
        allow_edit_return: true
        persist_only_after_explicit_confirmation: true
    authentication:
        required_for_production_write: true
        dry_run_must_never_write: true
