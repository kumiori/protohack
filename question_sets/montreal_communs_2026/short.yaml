editorial_review:
    - id: consent_legal_review
      status: open
      note:
          Le texte source affirme conservation sécurisée 5 ans, accès équipe de recherche, partage de certaines informations
          professionnelles et non-utilisation des données en cas d’abandon. Ces engagements doivent être validés par l’équipe responsable/juridique.
          Le YAML ne les transforme pas en garanties techniques.
    - id: q21_role_change
      status: intentional_change
      note:
          La Q21 fictionnelle du Markdown n’est pas reprise telle quelle. Elle devient une question sur les positions réelles
          d’action, avec une invitation optionnelle à explorer une autre position.
    - id: inspiration_recalibration_v3
      status: experimental_change
      note:
          'La typologie précédente était trop exhaustive : un participant pouvait raisonnablement presque tout sélectionner.
          La V3 demande jusqu’à trois sources que la personne souhaite apporter à la conversation et ouvre des catégories inattendues.'
    - id: organizer_voice_v3
      status: consolidated_change
      note:
          Les textes entre titre de section et question sont la voix des organisateur·ices et utilisent donc 'nous' lorsque
          le collectif organise/cartographie; les réponses individuelles restent formulées à la première personne.
    - id: payload_preview_v3
      status: implementation_required
      note:
          Avant toute écriture de production, le mode test doit pouvoir afficher exactement le payload qui serait transmis au
          backend/Notion. L’authentification et l’écriture réelle restent à câbler séparément.
