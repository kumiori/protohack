step_copy:
    welcome:
        title: Communs de données et IA
        body: |
            Pour démarrer le Forum Communs de données et IA (28–29 octobre, INRS), nous vous invitons à remplir ce court formulaire.

            Prévoyez environ 20 minutes pour répondre aux différentes questions.

            Les informations recueillies poursuivent deux objectifs :

            **Mieux nous connaître.** Vos réponses nous permettront de dresser et de présenter un portrait des personnes présentes : nos champs d’activité, les connaissances que nous sommes en mesure de partager, nos besoins en matière d’échange de savoirs et nos visions du futur.

            **Documenter nos projets, si applicable.** Si vous participez au nom d’une organisation culturelle, patrimoniale ou éducative porteuse d’un projet en lien avec la thématique du Forum, vous pouvez l’indiquer.

            Nous pourrons par la suite intégrer ces projets à la base de connaissances documentaire qui accompagne l’événement, en recueillant des informations sur les projets portés par les organisations : données, ressources, pratiques, gouvernance, licences, infrastructures et modèles économiques.

            Ces informations nous permettront, plus largement, de cartographier le réseau d’acteurs en présence, à travers les collaborations établies et les initiatives collectives existantes.

            Une version courte du formulaire est proposée à l’ensemble des participants ; la version longue s’adresse uniquement aux organisations porteuses d’un projet et prend quelques minutes de plus à remplir.

            Merci pour votre contribution à cette démarche collective.
        cta: Commencer
    participation_information:
        title: Informations sur ma participation
        body: |
            Les informations recueillies servent à préparer et documenter le Forum Communs de données et IA des 28–29 octobre 2026. Elles pourront également contribuer aux productions issues de cette expérimentation, notamment une présentation anonymisée des résultats lors du Forum, une synthèse ou des publications scientifiques.

            Mes réponses et mon identité sont traitées séparément. Mon nom n’est pas associé publiquement à mes réponses et n’est pas mentionné dans les publications issues du projet, sauf si je choisis explicitement de l’autoriser.

            Après intégration, mes réponses sont conservées dans une base de données du projet sécurisée hébergée à distance ([notion.so](http://notion.so)). Les données permettant de m’identifier sont conservées séparément des réponses au questionnaire et seront détruites après 5 ans.

            Je reste libre de répondre ou non à chaque question. Je peux interrompre le questionnaire à tout moment.

            Avant cette intégration, je peux examiner les données qui seront transmises.

            Lors de l’intégration, une clé d’accès personnelle me sera remise. Elle me permettra de retrouver et, selon les fonctionnalités proposées, de modifier mes réponses ou de les supprimer. Je conserverai cette clé soigneusement. Pour toute question concernant la méthodologie, la conception du questionnaire, le traitement des données ou cette expérimentation, je peux contacter les personnes responsables indiquées ci-dessous.

            **Responsables de l’enquête dans le cadre du projet Communs-IA**

            - Nathalie Casemajor, professeure à l’INRS; nathalie.casemajor@inrs.ca
            - Marta Severo, professeure à l’Université Paris Nanterre; msevero@parisnanterre.fr
            - Andrés A. León Baldelli, chargé de recherche CNRS; leon.baldelli@cnrs.fr
        cta: Continuer
    participation:
        title: Ma participation
        body:
            'L’atelier réunit un nombre restreint de 40 personnes sélectionnées sur invitation pour un engagement actif et collectif.
            Nous privilégions une présence aux deux journées : une disponibilité partielle peut potentiellement priver une autre personne
            d’y participer. En cas de disponibilité limitée, l’équipe pourra reprendre contact avec moi pour préciser les modalités.'
        cta: Continuer
    portrait:
        title: Qui suis-je ?
        body:
            'Je situe mon activité et, le cas échéant, mon organisation dans l’écosystème des acteurs présents au Forum. Aucune
            réponse substantielle n’est obligatoire : chaque question peut être passée.'
        cta: Continuer
    organisation:
        title: Mon organisation
        body: Ces questions apparaissent lorsque je participe au nom d’une organisation.
        cta: Continuer
    project:
        title: Un projet à documenter ?
        body:
            Si mon organisation développe un projet de mise à disposition de données dans le contexte des usages de l’IA, je
            peux choisir de le documenter.
        cta: Continuer
    exchange_offer:
        title: Ce que nous mettons en commun
        body:
            'Nous cartographions ce que nous pouvons partager sur les communs de données et l’IA : connaissances, expérimentations,
            outils ou ressources.'
        cta: Continuer
    exchange_need:
        title: Ce que je recherche
        body:
            'La même carte est utilisée dans les deux directions : ce que je peux apporter et ce que j’aimerais recevoir des
            autres.'
        cta: Continuer
    friction:
        title: Ce qui freine ma capacité à avancer
        body: Je distingue les contraintes actuelles des ressources ou connaissances que je recherche.
        cta: Continuer
    inspiration:
        title: Ce qui m’inspire
        body: Une initiative, un outil, une communauté ou une expérience peut ouvrir une piste inattendue.
        cta: Continuer
    future_intro:
        title: Genève 2027
        body: |
            Objectif : identifier des pistes d’action à travers un exercice de rétroplanification à partir d’un futur souhaité pour les communs de données, qui sera approfondi lors du Forum.

            En 2027, Genève accueillera le prochain sommet mondial sur l’IA, dans la continuité des sommets de Bletchley Park (2023), Séoul (2024), Paris (2025) et New Delhi (2026). Ce sommet intergouvernemental réunit des représentants des gouvernements, des organisations internationales, du secteur privé, du monde académique et de la société civile, dans le but de coordonner des positions sur l’usage responsable de l’IA, sa gouvernance et sa régulation à l’échelle internationale.

            Les éditions précédentes ont donné lieu à différents types de résultats : déclarations politiques multilatérales, rapports scientifiques indépendants, engagements volontaires du secteur privé, annonces de financement et d’infrastructure, coalitions thématiques permanentes, jalons vers une gouvernance mondiale institutionnalisée.

            Nous nous projetons au lendemain du sommet de Genève, dans un scénario favorable aux communs de données.
        cta: Je me projette
    future_outcome:
        title: Ce que nous aimerions voir émerger
        body: À quoi pourrait ressembler, pour nous, un résultat positif pour les communs de données ?
        cta: Continuer
    future_effects:
        title: Ce que ces résultats changeraient
        body: Passons du résultat souhaité à ses effets concrets dans nos pratiques, projets, organisations ou domaines de recherche.
        cta: Continuer
    future_conditions:
        title: Comment y arriver ?
        body: Décomposons le chemin en étapes ou actions, et associons à chacune les acteur·ices susceptibles de la porter.
        cta: Continuer
    future_contribution:
        title: Ce que je peux mettre sur la table
        body: Nous cherchons ici ce que chacun·e pourrait concrètement apporter pour rendre ce futur plus accessible.
        cta: Continuer
    scenario_position:
        title: Depuis quelle position puis-je agir ?
        body:
            Nous partons d’abord des positions réelles depuis lesquelles chacun·e peut agir. Nous pouvons ensuite ouvrir, si
            nous le souhaitons, une position à explorer pendant l’exercice.
        cta: Continuer
    review:
        title: Relire mes réponses
        body:
            Je relis, modifie et réaligne mes réponses. Les questions passées, les raisons de passage et les signalements doivent
            rester visibles et éditables.
        cta: Intégrer au paysage commun
    done:
        title: Merci
        body: |
            Merci d’avoir pris le temps de remplir ce questionnaire.

            Vos réponses ont bien été enregistrées. Vous recevrez prochainement d’autres informations pratiques concernant le déroulement de l’événement.

            Une question ? Écrivez-nous à nathalie.casemajor@inrs.ca, msevero@parisnanterre.fr.

            Au plaisir de vous accueillir à l’INRS en octobre.
        cta: Voir le paysage commun
