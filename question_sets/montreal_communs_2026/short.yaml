            - value: libraries
              label: Bibliothèques
            - value: education
              label: Éducation
            - value: museums
              label: Musées
            - value: research
              label: Science et recherche scientifique
            - value: open_knowledge
              label: Savoir ouvert
            - value: performing_arts
              label: Spectacle vivant
            - value: technology
              label: Technologie / numérique
            - value: other
              label: Autre
    functions:
        options:
            - value: leadership
              label: Direction et gouvernance
            - value: research_teaching
              label: Recherche et enseignement
            - value: collections
              label: Collections
            - value: data_tech
              label: Données, technologies et infrastructures
            - value: law_policy
              label: Droit, politiques publiques et gouvernance
            - value: communication_publics
