    - value: legal_policy
      label: Droit / politiques publiques / gouvernance
    - value: artist_creator
      label: Artiste / créateur·ice
    - value: funder
      label: Financeur / soutien
    - value: ai_company
      label: Entreprise d’IA / acteur commercial
    - value: international_org
      label: Organisation internationale
    - value: other
      label: Autre
  capacity_types:
    options:
    - value: knowledge
      label: Expertise / connaissance
    - value: data
      label: Données / collections / corpus
    - value: infrastructure
      label: Infrastructure / outil / code
    - value: network
      label: Réseau / mise en relation
    - value: institutional_access
      label: Accès institutionnel
    - value: decision_power
      label: Pouvoir de décision / mandat
    - value: legal_policy
      label: Expertise juridique / politique publique
    - value: facilitation
      label: Facilitation / organisation
    - value: communication
      label: Communication / mobilisation
    - value: funding
      label: Financement / ressources
    - value: documentation
      label: Documentation / recherche / évaluation
    - value: other
      label: Autre
  friction_types:
    options:
    - value: authority
      label: Mandat / pouvoir de décision
    - value: knowledge
      label: Expertise / connaissances
    - value: data
      label: Accès aux données
    - value: legal
      label: Cadre juridique / droits
    - value: infrastructure
      label: Infrastructure / outils
    - value: funding
      label: Financement
    - value: time
      label: Temps / disponibilité
    - value: coordination
      label: Coordination entre acteurs
    - value: institutional_support
      label: Soutien institutionnel
    - value: missing_actor
      label: Acteur nécessaire absent
    - value: uncertainty
      label: Information insuffisante / incertitude
    - value: other
      label: Autre
  unknown_types:
    options:
    - value: facts
      label: Faits / données
    - value: actors
