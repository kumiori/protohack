questions:
- step: event_time
  field: event_start
  id: event_start
  revision: 1
  prompt: Quand est-ce que le Forum commence ?
  input_type: multi_with_other
  required: false
  max_select: 2
  options:
  - value: arrival
    label: Quand nous arrivons à Montréal
  - value: preparation
    label: Pendant la préparation
  - value: already
    label: Il a déjà commencé
  - value: first_action
    label: Quand une première action arrive à cause du Forum
  - value: never_really_starts
    label: Il n’a pas de début net
  - value: dont_know
    label: Je ne sais pas encore
  - value: other
    label: Autre
  free_text:
    field: event_start_other
    prompt: Précisons si nous le souhaitons
- step: desired_difference
  field: desired_difference
  id: desired_difference
  revision: 1
  prompt: Qu’est-ce qui devrait exister après le 29 octobre qui n’existe pas aujourd’hui ?
  input_type: multi_with_other
  required: false
  max_select: 5
  options:
  - value: shared_language
    label: Un langage commun plus précis
  - value: legible_disagreements
    label: Des désaccords rendus lisibles
  - value: new_relationships
    label: De nouvelles relations utiles
  - value: decisions
    label: Des décisions
  - value: commitments
    label: Des engagements
  - value: experiments
    label: Des expérimentations en cours
  - value: infrastructure
    label: Un outil ou une infrastructure
  - value: coalition
    label: Une coalition / capacité collective
  - value: action
    label: Des actions déjà engagées
  - value: new_questions
    label: De nouvelles questions devenues visibles
  - value: other
    label: Autre
  free_text:
    field: desired_difference_other
    prompt: Autre différence observable
- step: actors
  field: actors_present
  id: actors_present
  revision: 1
  prompt: Quels acteurs sont déjà dans le champ ?
  input_type: grouped_multi
  required: false
  taxonomy: actor_types
  free_text:
    field: actors_present_other
    prompt: Autres acteurs
- step: actors
  field: actors_missing
  id: actors_missing
  revision: 1
  prompt: Qui manque aujourd’hui ?
  input_type: grouped_multi
  required: false
  taxonomy: actor_types
  free_text:
    field: actors_missing_other
    prompt: Qui manque précisément ?
- step: themes
  field: theme_capacity
  id: theme_capacity
  revision: 1
  prompt: Sur quels thèmes avons-nous aujourd’hui le plus de capacité d’action ?
  input_type: grouped_multi
  required: false
  max_select: 2
  taxonomy: forum_themes
- step: themes
  field: theme_need
  id: theme_need
  revision: 1
  prompt: Sur quels thèmes avons-nous aujourd’hui le plus besoin d’appui ?
  input_type: grouped_multi
  required: false
  max_select: 2
  taxonomy: forum_themes
- step: capacity_need
  field: capacities
  id: capacities
  revision: 1
  prompt: Quelles capacités pouvons-nous mobiliser ?
  input_type: grouped_multi
  required: false
  max_select: 5
  taxonomy: capacity_types
  companion:
    field: capacities_example
    prompt: Un exemple concret, si nous le souhaitons
- step: capacity_need
  field: needs
  id: needs
  revision: 1
  prompt: De quelles capacités avons-nous besoin ?
  input_type: grouped_multi
  required: false
  max_select: 5
  taxonomy: capacity_types
  companion:
    field: needs_example
    prompt: Un besoin concret, si nous le souhaitons
- step: contribution
  field: contribution
  id: contribution
  revision: 1
  prompt: Qu’est-ce que je peux mettre sur la table maintenant ?
  input_type: multi_with_other
  required: false
  max_select: 5
  options:
  - value: expertise
    label: Partager une expertise
  - value: data
    label: Partager des données / ressources
  - value: tool
    label: Mettre à disposition un outil / code
  - value: prototype
    label: Construire ou tester un prototype
  - value: network
    label: Mettre des personnes en relation
  - value: facilitate
    label: Faciliter / organiser
  - value: document
    label: Documenter / évaluer
  - value: institutional
    label: Porter quelque chose dans mon organisation
  - value: advocacy
    label: Plaider / mobiliser
  - value: funding
    label: Soutenir / financer
  - value: other
    label: Autre
  free_text:
    field: contribution_other
    prompt: Précisons la contribution
- step: authority
  field: authority
  id: authority
  revision: 1
  prompt: Qu’est-ce que je peux réellement décider ou autoriser ?
  input_type: multi_with_other
  required: false
  max_select: 4
  options:
  - value: own_work
    label: Ma propre manière de travailler
  - value: share_resource
    label: Partager une ressource / donnée / document
  - value: technical_change
    label: Faire ou autoriser un changement technique
  - value: convene
    label: Convoquer / organiser une rencontre
  - value: commit_time
    label: Engager du temps / des personnes
  - value: institutional_practice
    label: Modifier une pratique institutionnelle
  - value: partnership
    label: Engager / proposer un partenariat
  - value: budget
    label: Engager des ressources / un budget
  - value: policy
    label: Décider / influencer une règle ou politique
  - value: none_clear
    label: Mon autorité n’est pas claire
  - value: other
    label: Autre
  free_text:
    field: authority_other
    prompt: Précisons si utile
- step: authority
  field: authority_dependency
  id: authority_dependency
  revision: 1
  prompt: Qu’est-ce qui exige l’autorité de quelqu’un d’autre ?
  input_type: repeatable_group
  required: false
  min_items: 0
  fields:
  - field: authority_action
    prompt: Action / décision
    input_type: text_with_suggestions
    required: false
    suggestions:
    - Accès ou ouverture de données
    - Modification d’une politique
    - Engagement de ressources
    - Partenariat
    - Publication / communication
    - Choix technique / infrastructure
    - Autre
  - field: authority_actors
    prompt: De qui cela dépend-il ?
    input_type: grouped_multi
    required: false
    taxonomy: actor_types
- step: friction
  field: frictions
  id: frictions
  revision: 1
  prompt: Qu’est-ce qui m’empêche aujourd’hui d’agir comme je le voudrais ?
  input_type: grouped_multi
  required: false
  max_select: 5
  taxonomy: friction_types
  companion:
    field: friction_example
    prompt: Un exemple concret, si nous le souhaitons
- step: unknowns
  field: unknowns
  id: unknowns
  revision: 1
  prompt: Qu’est-ce que nous ne savons pas encore ?
  input_type: grouped_multi
  required: false
  max_select: 5
  taxonomy: unknown_types
  companion:
    field: unknown_detail
    prompt: Quelle inconnue faudrait-il lever en premier ?
- step: unknowns
  field: unknown_resolver
  id: unknown_resolver
  revision: 1
  prompt: Qui pourrait nous aider à lever cette inconnue ?
  input_type: grouped_multi
  required: false
  taxonomy: actor_types
- step: already_done
  field: already_done
  id: already_done
  revision: 1
  prompt: Qu’est-ce qui a déjà été fait ?
  input_type: repeatable_group
  required: false
  min_items: 0
  fields:
  - field: already_done_action
    prompt: Action déjà réalisée
    input_type: text_with_suggestions
    required: false
    suggestions:
    - Réunion / discussion
    - Cartographie
    - Document / note
    - Prototype
    - Prise de contact
    - Partenariat
    - Décision
    - Expérimentation
    - Autre
  - field: already_done_consequence
    prompt: Qu’est-ce qui s’est passé ensuite ?
    input_type: text
    required: false
- step: timeline
  field: timeline_constraints
  id: timeline_constraints
  revision: 1
  prompt: Quelles dates, décisions ou événements contraignent déjà notre trajectoire ?
  input_type: repeatable_group
  required: false
  min_items: 0
  fields:
  - field: date
    prompt: Date ou période
    input_type: text
    required: false
  - field: event
    prompt: Décision / événement / échéance
    input_type: text_with_suggestions
    required: false
    suggestions:
    - Réunion
    - Appel / financement
    - Décision institutionnelle
    - Publication
    - Événement public
    - Montréal 28–29 octobre
    - Genève
    - Autre
  - field: effect
    prompt: Pourquoi cela compte ?
    input_type: text
    required: false
- step: handshake
  field: handshake
  id: handshake
  revision: 1
  prompt: Quel premier handshake pourrait déjà avoir lieu ?
  input_type: repeatable_group
  required: false
  min_items: 0
  fields:
  - field: need
    prompt: Besoin / nécessité
    input_type: text_with_suggestions
    required: false
    suggestions:
    - Expertise
    - Données
    - Infrastructure
    - Autorité
    - Mise en relation
    - Financement
    - Information
    - Autre
  - field: capacity
    prompt: Capacité qui pourrait y répondre
    input_type: text_with_suggestions
    required: false
    suggestions:
    - Expertise
    - Données
    - Infrastructure
    - Autorité
    - Réseau
    - Financement
    - Temps / organisation
    - Autre
  - field: with_whom
    prompt: Avec qui ?
    input_type: grouped_multi
    required: false
    taxonomy: actor_types
  - field: next_operation
    prompt: Prochaine opération possible
    input_type: text_with_suggestions
    required: false
    suggestions:
    - Prendre contact
    - Partager une ressource
    - Organiser une réunion
    - Tester un outil
    - Vérifier une contrainte
    - Demander une autorisation
    - Formuler une proposition
    - Autre
  - field: trace
    prompt: Quelle trace nous dira que cela a eu lieu ?
    input_type: text_with_suggestions
    required: false
    suggestions:
    - Message / introduction
    - Document partagé
    - Décision
    - Prototype
    - Rendez-vous
    - Commit / issue
    - Compte rendu
    - Autre
interaction:
  question_resolution:
  - answer
  - skip
  - flag
  answer_before_meta_actions: true
  subordinate_fields_inherit_parent_resolution: true
  nothing_substantively_mandatory: true
  skip:
    enabled: true
    reason_prompt: Pourquoi est-ce que je passe cette question ?
    reasons:
    - value: not_applicable
      label: Non applicable
    - value: dont_know
      label: Je ne sais pas
    - value: prefer_not
      label: Je préfère ne pas répondre
    - value: cannot_answer
      label: La question ne me permet pas de répondre correctement
    - value: other
      label: Autre
    note_optional: true
  flag:
    enabled: true
    prompt: Signalons positivement ou négativement ce qui fonctionne, ce qui ne fonctionne pas ou mérite attention.
    options:
    - value: interesting
      label: Intéressante
    - value: useful
      label: Utile
    - value: thought_provoking
      label: Stimulante
    - value: well_framed
      label: Bien formulée
    - value: incomplete
      label: Incomplète
    - value: misleading
      label: Trompeuse
    - value: too_narrow
      label: Trop étroite
    - value: unclear
      label: Peu claire
    - value: missing_option
      label: Option manquante
    note_optional: true
  review_editable: true
representations:
- id: theme_capacity_need
  type: comparison
  scope: collective
  sources:
  - field: theme_capacity
    role: capacity
  - field: theme_need
    role: need
- id: capacity_need
  type: comparison
  scope: collective
  sources:
  - field: capacities
    role: capacity
  - field: needs
    role: need
- id: initial_field
  type: composite
  scope: collective
  components:
  - type: distribution
    source:
      field: event_start
  - representation: theme_capacity_need
  - representation: capacity_need
  - type: distribution
    source:
      field: frictions
  - type: distribution
    source:
      field: unknowns
- id: handshake_candidates
  type: records
  scope: collective
  source:
    field: handshake
- id: trajectory_constraints
  type: records
  scope: collective
  source:
    field: timeline_constraints
