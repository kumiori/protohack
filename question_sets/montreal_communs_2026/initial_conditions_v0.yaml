schema: probe-authoring/v1
questionnaire:
  id: montreal_initial_conditions_2026
  revision: 1
  status: review
  language: fr
  default_mode: standard
  show_mode_selection: false
  show_welcome_step: true
  review:
    change_note: 'Block 0 / Initial Conditions. Proof of concept for the Montréal handshake: establish the field
      before the Forum and expose capacities, needs, authority, constraints, unknowns, prior action and timeline.'
step_order:
- welcome
- event_time
- desired_difference
- actors
- themes
- capacity_need
- contribution
- authority
- friction
- unknowns
- already_done
- timeline
- handshake
- review
- done
flow_modes:
  standard:
    title: Commons Montréal — Conditions initiales
    detail: ~10–15 minutes
    steps:
    - event_time
    - desired_difference
    - actors
    - themes
    - capacity_need
    - contribution
    - authority
    - friction
    - unknowns
    - already_done
    - timeline
    - handshake
sections:
- id: orientation
  title: Quand commençons-nous ?
  steps:
  - event_time
  - desired_difference
  process:
    checkpoint: true
- id: field
  title: Le champ initial
  steps:
  - actors
  - themes
  - capacity_need
  - contribution
  - authority
  - friction
  - unknowns
  process:
    checkpoint: true
    sync_point: initial_field
- id: trajectory
  title: Ce qui est déjà en mouvement
  steps:
  - already_done
  - timeline
  - handshake
  process:
    checkpoint: true
    sync_point: initial_handshakes
step_copy:
  welcome:
    title: Le Forum commence-t-il déjà ?
    body: 'Le programme contient déjà une trajectoire implicite, de la compréhension vers l’action. Cette première
      passe nous sert à établir les conditions initiales : ce que nous voyons, ce que nous pouvons faire, ce dont
      nous avons besoin, ce qui nous contraint et ce qui est déjà en mouvement. L’objectif n’est pas de produire
      un document de plus, mais de rendre possibles des handshakes exécutables avant Montréal.


      Sauf indication contraire, plusieurs réponses peuvent être sélectionnées. Nous pouvons passer ou signaler
      chaque question. Nous pourrons relire et faire évoluer nos réponses.'
    cta: Commencer
  event_time:
    title: Quand est-ce que le Forum commence ?
    body: Choisissons ce qui décrit le mieux notre intuition aujourd’hui.
    cta: Continuer
  desired_difference:
    title: Qu’est-ce qui devrait exister après le 29 octobre qui n’existe pas aujourd’hui ?
    body: Pensons en termes de différence observable, pas seulement de livrable.
    cta: Continuer
  actors:
    title: Qui agit dans ce Forum ?
    body: Cartographions les acteurs que nous voyons déjà, puis ceux qui manquent.
    cta: Continuer
  themes:
    title: Où se situent aujourd’hui notre capacité et notre besoin ?
    body: Utilisons les quatre thèmes du programme comme premier repère commun.
    cta: Continuer
  capacity_need:
    title: Que pouvons-nous faire, et de quoi avons-nous besoin ?
    body: Cherchons les premières complémentarités possibles.
    cta: Continuer
  contribution:
    title: Qu’est-ce que je peux mettre sur la table maintenant ?
    body: Une capacité concrète, mobilisable avant ou pendant Montréal.
    cta: Continuer
  authority:
    title: Qu’est-ce que je peux décider ou autoriser ?
    body: Distinguons capacité et autorité. Une action possible techniquement peut dépendre de quelqu’un d’autre.
    cta: Continuer
  friction:
    title: Qu’est-ce qui m’empêche aujourd’hui d’agir comme je le voudrais ?
    body: Identifions les contraintes plutôt que de les confondre avec les besoins.
    cta: Continuer
  unknowns:
    title: Qu’est-ce que nous ne savons pas encore ?
    body: 'Une inconnue bien posée peut devenir une action : qui pourrait la lever ?'
    cta: Continuer
  already_done:
    title: Qu’est-ce qui a déjà été fait ?
    body: Partons de ce qui existe réellement. Si possible, indiquons aussi ce qui s’est passé ensuite.
    cta: Continuer
  timeline:
    title: Qu’est-ce qui contraint déjà notre calendrier ?
    body: Dates, décisions, réunions, appels, échéances ou événements qui structurent la trajectoire jusqu’à Montréal
      et au-delà.
    cta: Continuer
  handshake:
    title: Quel premier handshake pourrait déjà avoir lieu ?
    body: Un lien n’est pas seulement « A rencontre B ». Un handshake apparaît lorsqu’une capacité rencontre un
      besoin, qu’une dépendance est reconnue et qu’une prochaine opération devient possible.
    cta: Continuer
  review:
    title: Relire nos conditions initiales
    body: Relisons, corrigeons et réalignons avant d’intégrer cette trajectoire au paysage commun.
    cta: Intégrer au paysage commun
  done:
    title: Le champ initial existe
    body: Cette contribution peut maintenant rencontrer celles des autres et rendre visibles des dépendances, des
      complémentarités et de premiers handshakes.
    cta: Voir le paysage
